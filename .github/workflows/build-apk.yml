name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Keep screen on while rendering
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          cat > "$f" <<'EOF'
          package in.gaonkar.hindidocmaker;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          EOF

      - name: Storage permission for older Android (10 and below)
        run: |
          m=android/app/src/main/AndroidManifest.xml
          grep -q WRITE_EXTERNAL_STORAGE $m || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' $m
          grep -n permission $m

      - name: Use the same signing key every build (so updates keep your settings)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Sign every build with the repo keystore (explicit, so updates always install)
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "APK signature:"; $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HindiDocMaker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
